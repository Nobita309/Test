name: adblock

on:
  schedule:
    - cron: "0 */1 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install sing-box (retry forever)
        run: |
          sudo mkdir -p /etc/apt/keyrings &&
             sudo curl -fsSL https://sing-box.app/gpg.key -o /etc/apt/keyrings/sagernet.asc &&
             sudo chmod a+r /etc/apt/keyrings/sagernet.asc &&
             echo '
          Types: deb
          URIs: https://deb.sagernet.org/
          Suites: *
          Components: *
          Enabled: yes
          Signed-By: /etc/apt/keyrings/sagernet.asc
          ' | sudo tee /etc/apt/sources.list.d/sagernet.sources &&
             sudo apt-get update &&
             sudo apt-get install sing-box

      - name: Generate rule-sets in parallel (oisd / pro / tif)
        run: |
          set -e

          gen() {
            URL="$1"
            OUT="$2"

            while true; do
              curl -fsSL "$URL" -o "${OUT}.txt" && break
              echo "Retrying $OUT..."
              sleep 2
            done

            sing-box rule-set convert --type adguard --output "${OUT}.srs" "${OUT}.txt"
            rm "${OUT}.txt"
            echo "Generated ${OUT}.srs"
          }

          gen "https://gitlab.com/hagezi/mirror/-/raw/main/dns-blocklists/adblock/pro.txt" pro &
          gen "https://big.oisd.nl" oisd &
          gen "https://gitlab.com/hagezi/mirror/-/raw/main/dns-blocklists/adblock/tif.txt" tif &
          wait

      - name: Commit and push if there are changes
        run: |
          set -e

          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git add *.srs || true

          if ! git diff --staged --quiet; then
          git commit -m "Update adblock rule files"


          while true; do
            if git push; then
                echo "git push succeeded."
                break
            fi
              echo "git push failed, retrying in 3 seconds"
              sleep 3
              done
            else
              echo "No changes to commit."
            fi
